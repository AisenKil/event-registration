# Load balances /api across backend instances (round robin) and serves the built frontend.
# Host names below (backend1, backend2) are placeholders - match them to your own containers.
upstream api_servers {
    server backend1:3000;
    server backend2:3000;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://api_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
